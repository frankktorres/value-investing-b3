=\"align-self: flex-start;\"><i data-dc-tpl=\"108\" class=\"gl gl-nc\"><\/i>NÃO CONCLUSIVO<\/span><\/div>\n        <div data-dc-tpl=\"109\" class=\"pane\" style=\"display: flex; flex-direction: column; gap: 8px;\"><span data-dc-tpl=\"110\" class=\"small\">Protanopia<\/span>\n          <span data-dc-tpl=\"111\" class=\"chip\" style=\"align-self: flex-start; color: rgb(214, 212, 206); background: rgb(42, 44, 49); border-color: rgb(100, 101, 104);\"><i data-dc-tpl=\"112\" class=\"gl gl-barata\"><\/i>BARATA<\/span><span data-dc-tpl=\"113\" class=\"chip\" style=\"align-self: flex-start; color: rgb(188, 196, 218); border-color: rgb(69, 80, 108);\"><i data-dc-tpl=\"114\" class=\"gl gl-justa\"><\/i>JUSTA<\/span><span data-dc-tpl=\"115\" class=\"chip\" style=\"align-self: flex-start; color: rgb(214, 195, 103); background: rgb(40, 35, 9); border-color: rgb(108, 95, 22);\"><i data-dc-tpl=\"116\" class=\"gl gl-cara\"><\/i>CARA<\/span><span data-dc-tpl=\"117\" class=\"chip\" style=\"align-self: flex-start; color: rgb(177, 184, 205); border: 1px dashed rgb(99, 109, 135);\"><i data-dc-tpl=\"118\" class=\"gl gl-nc\"><\/i>NÃO CONCLUSIVO<\/span><\/div>\n        <div data-dc-tpl=\"119\" class=\"pane\" style=\"display: flex; flex-direction: column; gap: 8px;\"><span data-dc-tpl=\"120\" class=\"small\">Deuteranopia<\/span>\n          <span data-dc-tpl=\"121\" class=\"chip\" style=\"align-self: flex-start; color: rgb(194, 198, 209); background: rgb(36, 40, 49); border-color: rgb(89, 93, 105);\"><i data-dc-tpl=\"122\" class=\"gl gl-barata\"><\/i>BARATA<\/span><span data-dc-tpl=\"123\" class=\"chip\" style=\"align-self: flex-start; color: rgb(184, 192, 217); border-color: rgb(63, 76, 106);\"><i data-dc-tpl=\"124\" class=\"gl gl-justa\"><\/i>JUSTA<\/span><span data-dc-tpl=\"125\" class=\"chip\" style=\"align-self: flex-start; color: rgb(229, 210, 112); background: rgb(44, 39, 12); border-color: rgb(119, 107, 32);\"><i data-dc-tpl=\"126\" class=\"gl gl-cara\"><\/i>CARA<\/span><span data-dc-t
